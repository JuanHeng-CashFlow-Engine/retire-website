<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <meta name="theme-color" content="#102b47">
  <link rel="preload" as="image" href="assets/juanheng-homepage.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      background: #f4f8f6;
      color: #24342d;
      text-align: center;
    }
    main {
      width: 100%;
      margin: 0 auto;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hero {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      line-height: 0;
      overflow: hidden;
      background: #102b47;
    }
    .hero img {
      display: block;
      width: 100%;
      height: auto;
    }
    /*
      圖片中金色「開始我的退休健檢」按鈕的可點擊範圍。
      座標按原圖 1536 × 1024 比例設定，不改動圖片本身。
      圖中其他匯入／上傳按鈕只作視覺展示，不假裝已連接功能。
    */
    .hero-cta {
      position: absolute;
      left: 9.1%;
      top: 55.9%;
      width: 30.5%;
      height: 10.7%;
      display: block;
      margin: 0;
      padding: 0;
      border-radius: 999px;
      background: transparent;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hero-cta:focus-visible {
      outline: 3px solid #173d66;
      outline-offset: 3px;
      background: rgba(255, 255, 255, .12);
    }
    .bottom-actions {
      padding: 0 24px 42px;
      background: #f4f8f6;
    }
    /* 保留原始首頁最下方按鈕的文字、連結及綠色樣式。 */
    .bottom-actions a {
      display: inline-block;
      margin-top: 32px;
      padding: 14px 28px;
      color: white;
      background: #147a55;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      font-size: 18px;
    }
    .bottom-actions a:hover {
      background: #106b49;
    }
    .bottom-actions a:focus-visible {
      outline: 3px solid #c79532;
      outline-offset: 4px;
    }
    @media (max-width: 600px) {
      .bottom-actions {
        padding: 0 16px 32px;
      }
      .bottom-actions a {
        margin-top: 24px;
        max-width: 100%;
      }
    }
    @media (prefers-reduced-motion: reduce) {

</head>
<body>

</html>
